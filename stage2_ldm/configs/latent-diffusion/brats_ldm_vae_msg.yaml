# Paper settings: batch 12, lr 1e-4, AdamW weight decay 1e-6,
# gradient clipping 1.0, EMA 0.9999, linear beta schedule T=1000,
# UNet base width 160 with multipliers [1,2,4], DDIM eta=0 / 50 steps.
model:
  base_learning_rate: 1.0e-04
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    ckpt_path:
    linear_start: 0.0015
    linear_end: 0.0195
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: image
    cond_stage_key: image
    image_size: 24
    channels: 16
    scale_factor: 0.16
    cond_stage_trainable: false
    conditioning_key: hybrid
    monitor: val/loss_simple_ema
    use_scheduler: false          # constant learning rate, as in the paper
    val_gen_batches: 1
    val_gen_steps: 50
    val_gen_bs: 2

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 24
        in_channels: 164          # 16 (noisy latent) + 128 (fused_multiscale) + 4 (target_mask) + 16 (available latents)
        out_channels: 16          # 4 modalities x 4 VAE latents
        model_channels: 160
        attention_resolutions:
        - 4
        - 2
        num_res_blocks: 2
        channel_mult:
        - 1
        - 2
        - 4
        num_head_channels: 32
        transformer_depth: 1
        use_spatial_transformer: False

    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        ckpt_path:
        embed_dim: 4
        ddconfig:
          double_z: True
          z_channels: 4
          resolution: 192
          in_channels: 1
          out_ch: 1
          ch: 128
          ch_mult: [1, 1, 2, 4]
          num_res_blocks: 2
          attn_resolutions: [24]
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config: __is_unconditional__

    structural_features_config:
      target: ldm.models.msg.MSGModel
      params:
        n_modal: 4
        in_channels: 1
        ckpt_path:
        ignore_keys: []

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 12
    num_workers: 8
    train:
      target: ldm.taming.data.brats3.CustomTrain
      params:
        data_path: ../data/BraTS20/TrainingData
        # The paper does not specify a validation split; 10% of the training
        # subjects are held out for checkpoint selection and never optimized.
        val_ratio: 0.1
        seed: 42
    validation:
      target: ldm.taming.data.brats3.CustomVal
      params:
        data_path: ../data/BraTS20/TrainingData
        val_ratio: 0.1
        seed: 42

lightning:
  logger:
    target: pytorch_lightning.loggers.TensorBoardLogger
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 350
        max_images: 8
        increase_log_steps: False

  trainer:
    max_epochs: 100
    check_val_every_n_epoch: 1
    benchmark: True
    gradient_clip_val: 1.0
    accumulate_grad_batches: 1
