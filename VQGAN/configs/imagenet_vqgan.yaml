model:
  base_learning_rate: 1e-4
  target: taming.models.vqgan.VQModel
  params:
    ckpt_path: 
    embed_dim: 4
    n_embed: 8192
    ddconfig:
      double_z: False
      z_channels: 4
      resolution: 192
      in_channels: 1          
      out_ch: 1               
      ch: 128
      num_groups: 32
      ch_mult: [1, 1, 2, 4]
      num_res_blocks: 2
      attn_resolutions: [16]
      dropout: 0.0

    lossconfig:
      target: taming.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
      params:
        disc_conditional: False
        disc_in_channels: 1
        disc_start: 0
        disc_weight: 1.0
        codebook_weight: 1.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 9
    num_workers: 3
    train:
      target: taming.data.whm.CustomTrain
      params:
        data_path: 
        phase: train
    validation:
      target: taming.data.whm.CustomTest
      params:
        data_path: 
        phase: val
    test:
      target: taming.data.whm.CustomTest
      params:
        data_path: 
        phase: test


lightning:
  trainer:
    max_epochs: 300
    check_val_every_n_epoch: 10
    benchmark: True
